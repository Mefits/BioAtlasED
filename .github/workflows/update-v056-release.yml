name: Update v0.5.6 release description
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-v056-release.yml
permissions:
  contents: write
jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Update published release body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('RELEASE_NOTES_v0.5.6.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: 431626998,
              body
            });
